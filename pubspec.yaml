name: moneywise
description: "Money Wise – Personal finance management for university students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0
  firebase_messaging: ^17.1.0
  google_sign_in: ^7.2.0

  # State & navigation
  provider: ^6.1.5+1

  # Local database
  sqflite: ^2.4.6
  path_provider: ^2.1.6
  path: ^1.9.1

  # UI & icons
  bootstrap_icons: ^1.13.2

  # Charts & export
  fl_chart: ^1.2.0
  pdf: ^3.13.1
  printing: ^5.15.1
  csv: ^8.0.0

  # Utilities
  shared_preferences: ^2.5.6
  connectivity_plus: ^6.1.5
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
